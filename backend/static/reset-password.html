<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRANA | Reset Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="login-box">

        <h1>new password</h1>
        <p class="subtitle">almost there....</p>

        <div id="invalidLink" hidden>
            <p class="details">this reset link is invalid or has expired.</p>
            <a href="forgot-password.html" class="signup">request a new link</a>
        </div>

        <form id="resetForm" novalidate>
            <p class="details">create a new password</p>

            <label for="newPassword">new password</label>
            <input type="password" id="newPassword" placeholder="at least 8 characters" autocomplete="new-password" required>

            <label for="confirmPassword">confirm new password</label>
            <input type="password" id="confirmPassword" placeholder="retype password" autocomplete="new-password" required>

            <p id="message" style="margin-top:15px;font-size:14px;min-height:20px;color:#a2513f;"></p>

            <button type="submit" id="resetBtn">RESET PASSWORD</button>
        </form>

        <a href="login.html" class="signup">← back to login</a>

    </div>

</div>

<script src="api.js"></script>
<script>
    const token = new URLSearchParams(window.location.search).get("token");

    const form = document.getElementById("resetForm");
    const newPassword = document.getElementById("newPassword");
    const confirmPassword = document.getElementById("confirmPassword");
    const message = document.getElementById("message");
    const resetBtn = document.getElementById("resetBtn");

    /* A reset link must carry a token. The server checks that it is valid. */
    if (!token) {
        form.hidden = true;
        document.getElementById("invalidLink").hidden = false;
    }

    form.addEventListener("submit", async function (event) {
        event.preventDefault();
        message.textContent = "";

        if (newPassword.value.length < 8) {
            message.textContent = "Password must be at least 8 characters.";
            return;
        }
        if (newPassword.value !== confirmPassword.value) {
            message.textContent = "Passwords do not match.";
            return;
        }

        resetBtn.disabled = true;
        resetBtn.textContent = "SAVING...";

        try {
            await api("/auth/reset", {
                method: "POST",
                body: { token, password: newPassword.value }
            });
            alert("Password reset. Please log in with your new password.");
            window.location.href = "login.html";
        } catch (err) {
            message.textContent = err.message;
            resetBtn.disabled = false;
            resetBtn.textContent = "RESET PASSWORD";
        }
    });
</script>

</body>
</html>
