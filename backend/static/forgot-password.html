<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>TRANA | Forgot password</title>

    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="css(signup).css">
</head>

<body>

    <main class="container">

        <section class="signup-box">

            <h1>forgot password</h1>

            <p class="subtitle">
                we'll email you a link to reset it
            </p>

            <form id="forgotForm" novalidate>

                <p class="details">
                    enter your account email
                </p>

                <!-- Email -->
                <label for="email">
                    email address
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    required
                    maxlength="120"
                >


                <!-- Message -->
                <p
                    id="message"
                    role="status"
                    aria-live="polite"
                    style="min-height:20px"
                ></p>


                <!-- Submit -->
                <button
                    type="submit"
                    id="forgotBtn"
                >
                    SEND RESET LINK
                </button>

            </form>


            <!-- Login Link -->
            <a href="login.html" class="signup">
                back to login
            </a>

        </section>

    </main>


    <!-- API -->
    <script src="api.js"></script>


    <!-- Forgot Password Logic -->
    <script>

        const form = document.getElementById("forgotForm");

        const btn = document.getElementById("forgotBtn");

        const msg = document.getElementById("message");


        form.addEventListener("submit", async e => {

            e.preventDefault();

            msg.textContent = "";


            const email = form.email.value.trim().toLowerCase();


            // Basic validation
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {

                msg.style.color = "#a2513f";

                msg.textContent = "Please enter a valid email address.";

                return;
            }


            // Loading state
            btn.disabled = true;

            btn.textContent = "SENDING...";


            try {

                // Ask the server to email a reset link
                const result = await api("/auth/forgot", {

                    method: "POST",

                    body: { email }

                });


                // Success (the server never says whether the account exists)
                msg.style.color = "#536b50";

                msg.textContent =
                    result.message ||
                    "If an account exists for that email, a reset link has been sent.";

                form.reset();


            } catch (err) {

                msg.style.color = "#a2513f";

                msg.textContent = err.message;


            } finally {

                // Restore button
                btn.disabled = false;

                btn.textContent = "SEND RESET LINK";

            }

        });

    </script>

</body>

</html>
