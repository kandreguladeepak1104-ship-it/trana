<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRANA | Forgot Password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="login-box">

        <h1>forgot password?</h1>
        <p class="subtitle">no worries, it happens....</p>

        <form id="forgotForm" novalidate>
            <p class="details">enter your email</p>

            <label for="email">email address</label>
            <input type="email" id="email" placeholder="you@example.com" required>

            <p id="message" style="margin-top:15px;font-size:14px;min-height:20px;"></p>

            <button type="submit">SEND RESET LINK</button>
        </form>

        <a href="login.html" class="signup">← back to login</a>

    </div>

</div>

<script>
    const form = document.getElementById("forgotForm");
    const email = document.getElementById("email");
    const message = document.getElementById("message");

    form.addEventListener("submit", function (event) {
        event.preventDefault();

        const value = email.value.trim();
        const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);

        if (!valid) {
            message.style.color = "#a2513f";
            message.textContent = "Please enter a valid email address.";
            return;
        }

        /* Same message whether or not the account exists,
           so the form can't be used to discover accounts. */
        message.style.color = "#536b50";
        message.textContent = "If an account exists for that email, a reset link has been sent.";
        form.reset();
    });
</script>

</body>
</html>
